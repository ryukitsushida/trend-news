# カテゴリは「どのフィードから来たか」ではなく「記事の内容」で決まる。
# 話題が1つに定まるフィードは category を固定してAI分類をスキップし(確実・安価)、
# 話題が横断するフィード(はてブ、Hacker News など)だけ分類パスに回す。

# 通常のニュース系フィードの収集ウィンドウ
window_hours: 30
# slow: true のフィード(公式ブログ・注意喚起など更新頻度が低い)のウィンドウ。
# 掲載済みURLは除外されるので、長くしても同じ記事が何日も出続けることはない。
slow_window_hours: 240
max_items_per_feed: 10      # 更新の多いフィードが枠を独占しないようにする
topics_per_category: 5      # しっかり要約する件数
quick_hits_per_category: 5  # タイトル+一行コメントで流す件数
highlight_count: 5          # 先頭の「今日の5選」

# サイトに公開するアーカイブの日数。JSON自体は data/digests に全て残るので
# 履歴と掲載済みURLの除外には影響しない。公開ページ数と1日の生成量を抑えるための設定。
# GitHub Pages の1GB上限に達するのは実測で約23年後なので、容量ではなく
# ビルド時間とアーカイブ一覧の見やすさのための上限。null で無制限。
archive_days: 365

categories:
  - id: ai
    label: AI・LLM
    description: |
      LLM/生成AIのモデル・製品リリース、研究成果、AI開発ツールやフレームワーク、
      AI企業(OpenAI/Anthropic/Google等)の動向、AIの安全性・規制・倫理。
  - id: security
    label: セキュリティ
    description: |
      脆弱性(CVE)、ゼロデイ、情報漏洩・侵害インシデント、マルウェアや攻撃手法、
      セキュリティ対策・ガイドライン・注意喚起。
  - id: cloud
    label: クラウド・インフラ
    description: |
      AWS/GCP/Azureのアップデート、Kubernetes・コンテナ、IaC、SRE・可観測性、
      ネットワーク、データベース、データセンター。
  - id: dev
    label: 開発・エンジニアリング
    description: |
      プログラミング言語・フレームワーク、OSS、開発ツール・エディタ、
      設計/アーキテクチャ、開発手法、エンジニアの働き方。
  - id: product
    label: プロダクト・ビジネス
    description: |
      IT企業の経営・組織の動向、資金調達・M&A・IPO、コンシューマ向け新製品、
      市場動向、テック業界に関わる規制・訴訟。
  - id: general
    label: 一般ニュース
    description: |
      IT以外の政治・経済・社会・国際情勢。

# 公開JSON APIから取得するソース。RSSでは人気度が取れないため、
# LGTM・いいね・スコアを直接取れるAPIを使い、新着順ではなく人気順に採用する。
json_sources:
  - { name: Qiita 人気,    kind: qiita,    days: 5, min_stocks: 20, slow: true }
  - { name: Zenn トレンド,  kind: zenn,     slow: true }
  - { name: Lobsters,     kind: lobsters, slow: true }

