  - { name: はてブ 世の中,      url: "https://b.hatena.ne.jp/hotentry/social.rss" }
  - { name: Hacker News,        url: "https://hnrss.org/frontpage?points=100" }
  - { name: Publickey,          url: "https://www.publickey1.jp/atom.xml", slow: true }
  - { name: ITmedia NEWS,       url: "https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml" }
  - { name: ITmedia エンタープライズ, url: "https://rss.itmedia.co.jp/rss/2.0/enterprise.xml" }
